aws-monitoring-terraform-runner:
  description: "Deploys the pinned aws-monitoring-terraform-framework to the organization's AWS account from GitHub Actions."
  visibility: "public"
  topics:
    - aws
    - terraform
    - infrastructure-as-code
    - github-actions
    - cloudwatch
    - monitoring
    - devsecops
    - security
  required_checks:
    - "make ci"
