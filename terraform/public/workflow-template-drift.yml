workflow-template-drift:
  description: "Repository for a planned workflow container that will evaluate repositories against template drift configuration and emit deterministic PASS/WARNING/FAIL reports with git-applicable remediation patches."
  visibility: "public"
  topics:
    - template-drift
    - drift-detection
    - workflow-container
  required_checks:
    - "host harness (spike replay)"
    - "image parity (harness inside the built image)"
