name: 'Deploy GitHub Terraform'

on:
  # This workflow file is in its own paths filter on purpose. It carries the
  # framework pin, and the framework is what turns these YAML files into API
  # calls -- so a pin bump can change the outcome for every managed resource
  # while touching nothing under terraform/. Without this entry such a change
  # merges with no plan run at all, which is precisely the review the plan gate
  # exists to provide.
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  schedule:
    # Nightly drift detection. Odd minute on purpose: GitHub is more likely to
    # delay or drop schedules clustered at the top of the hour.
    #
    # A scheduled run already does the right thing without new plumbing --
    # plan_only is false (so it reads real S3 state) and apply is false (so it
    # changes nothing). All that was missing was somewhere for the result to go.
    - cron: "37 6 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the previously reviewed real-state plan.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  issues: write # drift detection opens/closes an issue in this repo

concurrency:
  group: tf-${{ github.event.repository.name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: nwarila-platform/github-terraform-framework/.github/workflows/reusable-terraform-deploy.yaml@f41ca27ad4f25368dff6fe3d7581085018f54009  # post-#92 (drift_issue input)
    with:
      github_owner: ${{ github.repository_owner }}
      github_is_organization: true
      framework_ref: "f41ca27ad4f25368dff6fe3d7581085018f54009"
      terraform_version: "1.15.4"
      # Required: default tail is terraform/private, but this data lives under repos; dropping this reintroduces the blinkstick archival bug.
      private_repos_prefix: "nwarila-platform/github-terraform-runner/repos"
      plan_only: ${{ github.event_name == 'pull_request' }}
      apply: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
      # Scheduled runs ONLY. On push, a non-empty plan means config was merged
      # and not yet applied -- that is pending work, not drift, and filing it as
      # drift would cry wolf on every ordinary merge.
      drift_issue: ${{ github.event_name == 'schedule' }}
    secrets:
      aws_role_arn:      ${{ secrets.AWS_ROLE_TO_ASSUME }}
      aws_region:        ${{ secrets.AWS_REGION }}
      backend_bucket:    ${{ secrets.AWS_S3_BUCKET }}
      gh_token:          ${{ secrets.FINE_GRAINED_PERSONAL_ACCESS_TOKEN }}
      org_billing_email: ${{ secrets.ORG_BILLING_EMAIL }}
