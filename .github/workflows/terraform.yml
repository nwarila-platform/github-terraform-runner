name: 'Deploy GitHub Terraform'

on:
  # This workflow file is in its own paths filter on purpose. It carries the
  # framework pin, and the framework is what turns these YAML files into API
  # calls -- so a pin bump can change the outcome for every managed resource
  # while touching nothing under terraform/. Without this entry such a change
  # merges with no plan run at all, which is precisely the review the plan gate
  # exists to provide.
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  schedule:
    # Nightly ETag-stripped detector run. Odd minute on purpose: GitHub is more
    # likely to delay or drop schedules clustered at the top of the hour.
    # Detector mode assumes the mandatory read-only plan role, copies canonical
    # state, strips ETags, reads it locally, skips adoption/the destroy guard,
    # and reports every actionable plan row.
    - cron: "37 6 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the previously reviewed real-state plan.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  issues: write # drift detection opens/closes an issue in this repo

concurrency:
  group: tf-${{ github.event.repository.name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: nwarila-platform/github-terraform-framework/.github/workflows/reusable-terraform-deploy.yaml@5b4cc46d703381d76ffbcecbb282d1302a9fbf27  # post-#99 (read-only ETag-stripped detector mode)
    with:
      github_owner: ${{ github.repository_owner }}
      github_is_organization: true
      framework_ref: "5b4cc46d703381d76ffbcecbb282d1302a9fbf27"
      terraform_version: "1.15.4"
      # Required: default tail is terraform/private, but this data lives under repos; dropping this reintroduces the blinkstick archival bug.
      private_repos_prefix: "nwarila-platform/github-terraform-runner/repos"
      plan_only: ${{ github.event_name == 'pull_request' }}
      apply: >-
        ${{ github.event_name == 'push'
            || (github.event_name == 'workflow_dispatch' && inputs.apply) }}
      # The primary job enters detector mode for scheduled and non-applying
      # dispatch runs. Push and applying-dispatch runs use writer/apply mode here;
      # post_apply_detector runs afterward in read-only detector mode.
      drift_issue: >-
        ${{ github.event_name == 'schedule'
            || (github.event_name == 'workflow_dispatch' && !inputs.apply) }}
    secrets:
      aws_role_arn:      ${{ secrets.AWS_ROLE_TO_ASSUME }}
      # Mandatory read-only role for plan_only pull-request runs and detector-mode
      # schedule, non-applying-dispatch, and post-apply runs.
      aws_plan_role_arn: ${{ secrets.AWS_PLAN_ROLE_TO_ASSUME }}
      aws_region:        ${{ secrets.AWS_REGION }}
      backend_bucket:    ${{ secrets.AWS_S3_BUCKET }}
      gh_token:          ${{ secrets.FINE_GRAINED_PERSONAL_ACCESS_TOKEN }}
      org_billing_email: ${{ secrets.ORG_BILLING_EMAIL }}

  post_apply_detector:
    needs: deploy
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply)) }}
    uses: nwarila-platform/github-terraform-framework/.github/workflows/reusable-terraform-deploy.yaml@5b4cc46d703381d76ffbcecbb282d1302a9fbf27
    with:
      github_owner: ${{ github.repository_owner }}
      github_is_organization: true
      framework_ref: "5b4cc46d703381d76ffbcecbb282d1302a9fbf27"
      terraform_version: "1.15.4"
      private_repos_prefix: "nwarila-platform/github-terraform-runner/repos"
      plan_only: false
      apply: false
      drift_issue: true
    secrets:
      aws_role_arn:      ${{ secrets.AWS_ROLE_TO_ASSUME }}
      aws_plan_role_arn: ${{ secrets.AWS_PLAN_ROLE_TO_ASSUME }}
      aws_region:        ${{ secrets.AWS_REGION }}
      backend_bucket:    ${{ secrets.AWS_S3_BUCKET }}
      gh_token:          ${{ secrets.FINE_GRAINED_PERSONAL_ACCESS_TOKEN }}
      org_billing_email: ${{ secrets.ORG_BILLING_EMAIL }}
