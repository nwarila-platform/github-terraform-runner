name: 'Deploy GitHub Terraform'

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
  push:
    branches: [main]
    paths:
      - "terraform/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: tf-${{ github.event.repository.name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: nwarila-platform/github-terraform-framework/.github/workflows/reusable-terraform-deploy.yaml@37602cb8ff5d22aaebf4011eb02639de2ddbd6e3  # framework GS-01 baseline - pinned PRE org-wide last-push-approval (#74); GS-05 bumps this deliberately
    with:
      github_owner: ${{ github.repository_owner }}
      framework_ref: "37602cb8ff5d22aaebf4011eb02639de2ddbd6e3"
      terraform_version: "1.15.4"
      private_repos_files: ${{ vars.PRIVATE_REPOS_FILES }}
      plan_only: ${{ github.event_name == 'pull_request' }}
    secrets:
      aws_role_arn:    ${{ secrets.AWS_ROLE_TO_ASSUME }}
      aws_region:      ${{ secrets.AWS_REGION }}
      backend_bucket:  ${{ secrets.AWS_S3_BUCKET }}
      gh_token:        ${{ secrets.FINE_GRAINED_PERSONAL_ACCESS_TOKEN }}
